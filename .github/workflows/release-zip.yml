name: Build & Attach Release Zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Compute version number from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assemble clean theme folder
        run: |
          mkdir -p build/mec_theme
          rsync -av --exclude-from=".distignore" ./ build/mec_theme/

      - name: Sync style.css Version and readme.txt Stable tag to the release tag
        run: |
          sed -i "s/^Version:.*/Version: ${{ steps.version.outputs.number }}/" build/mec_theme/style.css
          if [ -f build/mec_theme/readme.txt ]; then
            sed -i "s/^Stable tag:.*/Stable tag: ${{ steps.version.outputs.number }}/" build/mec_theme/readme.txt
          fi

      - name: Create versioned zip
        run: |
          cd build
          zip -r "mec_theme-${{ github.event.release.tag_name }}.zip" mec_theme

      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/mec_theme-${{ github.event.release.tag_name }}.zip
